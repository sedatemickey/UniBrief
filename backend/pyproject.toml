[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unibrief-backend"
version = "0.1.0"
description = "UniBrief FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.115,<1.0",
  "itsdangerous>=2.2,<3.0",
  "openai>=1.60,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyMySQL>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1.0",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]




